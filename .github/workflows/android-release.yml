# DYLANDOS IPTV ULTIMATE — Android build, test & OTA release pipeline (C7)
#
#  - Every PR / push:      runs the JVM unit tests (fast, no emulator)
#  - Tag push (vX.Y.Z):    builds + signs BOTH release flavors with CI secrets,
#                          uploads APKs to a GitHub Release, computes SHA-256,
#                          regenerates update.json, and pushes it to the live
#                          OTA gist (fixes the stale-gist problem permanently).
#
# Required repository secrets:
#   DYLANDOS_KEYSTORE_BASE64          (base64 of android/app/dylandos-release.jks — the
#                                     keystore itself is gitignored)
#   DYLANDOS_RELEASE_STORE_PASSWORD   (matches android/app/build.gradle.kts signing)
#   DYLANDOS_RELEASE_KEY_PASSWORD
#   GIST_TOKEN                        (fine-grained PAT with gist write scope; optional —
#                                     without it the Release is created but the gist is
#                                     left for manual update)

name: Android Build & OTA Release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Run unit tests for both flavors
        working-directory: android
        run: ./gradlew testFirestickDebugUnitTest testPremiumDebugUnitTest

  release-build:
    name: Build + sign release APKs
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      DYLANDOS_RELEASE_STORE_PASSWORD: ${{ secrets.DYLANDOS_RELEASE_STORE_PASSWORD }}
      DYLANDOS_RELEASE_KEY_PASSWORD: ${{ secrets.DYLANDOS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Decode release keystore from secret
        env:
          DYLANDOS_KEYSTORE_BASE64: ${{ secrets.DYLANDOS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DYLANDOS_KEYSTORE_BASE64" ]; then
            echo "$DYLANDOS_KEYSTORE_BASE64" | base64 -d > android/app/dylandos-release.jks
          else
            echo "::error::DYLANDOS_KEYSTORE_BASE64 secret is not set — release signing will fail"
            exit 1
          fi
      - name: Build Firestick + Premium release APKs
        working-directory: android
        run: ./gradlew assembleFirestickRelease assemblePremiumRelease
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            android/app/build/outputs/apk/firestick/release/app-firestick-release.apk
            android/app/build/outputs/apk/premium/release/app-premium-release.apk
          retention-days: 30

  publish-ota:
    name: Publish GitHub Release + update OTA gist
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Compute SHA-256 hashes + sizes
        working-directory: apks
        run: |
          sha256sum app-firestick-release.apk | awk '{print $1}' > firestick.sha256
          sha256sum app-premium-release.apk | awk '{print $1}' > premium.sha256
          ls -l
      - name: Read version info
        id: version
        run: |
          echo "version_code=$(sed -n 's/.*versionCode *= *\([0-9][0-9]*\).*/\1/p' android/app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apks/app-firestick-release.apk
            apks/app-premium-release.apk
          generate_release_notes: true
      - name: Publish update.json to OTA gist
        if: env.GIST_TOKEN != ''
        working-directory: apks
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: c3eda014bd60ef939da246f1896066e4
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.tag }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: python3 ../.github/scripts/publish_update_json.py
